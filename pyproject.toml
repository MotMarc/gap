[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generation-attribution-protocol"
version = "1.0.0"
description = "Python SDK and reference service for the Generation Attribution Protocol"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "cryptography>=49,<50",
  "httpx>=0.28,<0.29",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.14,<3",
  "fastapi>=0.139,<0.140",
  "sqlalchemy>=2.0,<3",
  "pillow>=12.3,<13",
  "uvicorn>=0.51,<0.52",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.15,<0.16", "build>=1,<2"]

[project.scripts]
gap = "gap_sdk.cli:main"

[tool.setuptools]
package-dir = {"" = "implementation"}

[tool.setuptools.packages.find]
where = ["implementation"]
include = ["gap_sdk*", "app*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["implementation"]
